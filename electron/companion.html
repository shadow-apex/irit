<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iris Companion</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #e8ecf3;
    font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  video { width: 100%; flex: 1; min-height: 0; object-fit: cover; background: #000; transform: scaleX(-1); }
  #status { padding: 8px 14px; font-size: 13px; color: #8b95a7; min-height: 18px; text-align: center; }
  #bar { display: flex; gap: 10px; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  button { flex: 1; padding: 15px; font-size: 16px; border: 0; border-radius: 12px;
    background: #28cdaa; color: #fff; font-weight: 600; cursor: pointer; }
  button.alt { background: #152a1e; color: #28cdaa; border: 1px solid #28cdaa; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div id="wrap">
  <video id="preview" autoplay muted playsinline></video>
  <div id="status">Status: STANDBY (Ready to connect)</div>
  <div id="mic-status" style="display:none; text-align:center; font-size:13px; padding-bottom:4px; color:#ff6b6b;">🔇 Mic đã bị tắt từ Iris (PC)</div>
  <div id="bar">
    <button id="start">CONNECT TO IRIS</button>
    <button id="flip" class="alt">Flip Camera</button>
  </div>
</div>
<script>
const $  = (id) => document.getElementById(id);
const log = (t) => { $('status').textContent = 'Status: ' + t; console.log('[phone]', t); };

// BUGFIX-COMP-ICE-01: xem comment tương ứng trong CompanionWebRTC.tsx (phía
// desktop) — phải khai báo CÙNG một danh sách iceServers (bao gồm TURN) ở cả
// hai đầu, vì mỗi bên tự gather candidate của chính nó. Nếu chỉ desktop có
// TURN mà điện thoại không có, điện thoại sẽ không bao giờ tạo ra được
// "relay candidate" của riêng nó để gửi sang, và kết nối vẫn thất bại y hệt
// như trước khi thêm TURN.
const RTC_CFG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    {
      urls: [
        'turn:openrelay.metered.ca:80',
        'turn:openrelay.metered.ca:443',
        'turn:openrelay.metered.ca:443?transport=tcp',
      ],
      username: 'openrelayproject',
      credential: 'openrelayproject',
    },
  ],
  iceCandidatePoolSize: 4,
};

let pc, ws, localStream;
let facing = 'user';
let started = false;
// FEAT-COMP-MIC-01: PC gửi tín hiệu 'mic-toggle' qua kênh signalling WebRTC
// đã có sẵn (companionStream.requestMicToggle -> sendCompanionWebRTCSignal
// -> companion:webrtc-signal-to-phone -> companion-server.mjs -> WS này) để
// tắt/bật mic điện thoại từ xa mà không cần renegotiate WebRTC. Nhớ trạng
// thái mong muốn ở đây để áp dụng lại mỗi khi có localStream mới (ví dụ khi
// Flip Camera gọi lại getCam(), track audio cũ bị stop() và thay track mới
// — track mới phải giữ đúng trạng thái mute hiện tại thay vì tự bật lại).
let micWanted = true;

function vtrack() { return localStream && localStream.getVideoTracks()[0]; }
function atrack() { return localStream && localStream.getAudioTracks()[0]; }

function applyMicWanted() {
  const at = atrack();
  if (at) at.enabled = micWanted;
  $('mic-status').style.display = micWanted ? 'none' : 'block';
}

async function getCam(constraints) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("LỖI BẢO MẬT: Trình duyệt chặn quyền Camera/Mic vì link này không an toàn (HTTP). Bạn vui lòng dùng link HTTPS (ngrok tunnel) hoặc dùng Safari trên kết nối HTTPS.");
    throw new Error("HTTP connection blocked camera");
  }

  if (localStream) localStream.getTracks().forEach((t) => t.stop());
  localStream = await navigator.mediaDevices.getUserMedia(constraints || {
    video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
    audio: { echoCancellation: true, noiseSuppression: true }
  });
  const vt = vtrack();
  if (vt) vt.contentHint = 'motion';
  $('preview').srcObject = localStream;
  $('preview').style.transform = facing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
  // FEAT-COMP-MIC-01: getUserMedia() luôn tạo audio track MỚI ở trạng thái
  // enabled=true mặc định — nếu người dùng đã tắt mic từ PC trước đó rồi
  // sau đó bấm "Flip Camera" (gọi lại getCam()), track mới phải bị tắt lại
  // ngay để không vô tình "bật mic trở lại" ngoài ý muốn của PC.
  applyMicWanted();
}

async function swapTracks() {
  if (!pc) return;
  const vt = vtrack(), vs = pc.getSenders().find((s) => s.track && s.track.kind === 'video');
  if (vs && vt) await vs.replaceTrack(vt);
  const at = localStream.getAudioTracks()[0], as = pc.getSenders().find((s) => s.track && s.track.kind === 'audio');
  if (as && at) await as.replaceTrack(at);
}

function preferH264() {
  const tr = pc.getTransceivers().find((t) => t.sender && t.sender.track && t.sender.track.kind === 'video');
  if (!tr || !tr.setCodecPreferences || !window.RTCRtpSender || !RTCRtpSender.getCapabilities) return;
  try {
    const caps = RTCRtpSender.getCapabilities('video'); if (!caps) return;
    const h = caps.codecs.filter((c) => /h264/i.test(c.mimeType));
    const rest = caps.codecs.filter((c) => !/h264/i.test(c.mimeType));
    if (h.length) tr.setCodecPreferences([...h, ...rest]);
  } catch (e) {}
}

function newPC() {
  if (pc) { try { pc.close(); } catch (e) {} }
  pc = new RTCPeerConnection(RTC_CFG);
  localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
  preferH264();
  pc.onicecandidate = (e) => {
    if (e.candidate) {
      // BUGFIX-COMP-ICE-01: log loại candidate (host/srflx/relay) trong
      // Safari/Chrome remote debug để chẩn đoán nhanh nếu vẫn không lên hình.
      const type = e.candidate.type || (e.candidate.candidate || '').match(/typ (\w+)/)?.[1];
      log('ICE candidate: ' + type);
      ws.send(JSON.stringify({ type: 'ice', candidate: e.candidate }));
    }
  };
  pc.onconnectionstatechange = () => log('WebRTC: ' + pc.connectionState);
  pc.oniceconnectionstatechange = () => {
    console.log('[phone] ICE state:', pc.iceConnectionState);
    if (pc.iceConnectionState === 'failed') {
      log('WebRTC: ICE FAILED (kiểm tra mạng / TURN)');
    }
  };
}

async function makeOffer() {
  if (!localStream) return;
  newPC();
  await pc.setLocalDescription(await pc.createOffer());
  ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription }));
  log('Offer sent, connecting...');
}

function connectWS() {
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  let wsUrl = `${protocol}//${window.location.host}`;
  const token = new URLSearchParams(window.location.search).get('token');
  if (token) wsUrl += `?token=${token}`;

  ws = new WebSocket(wsUrl);
  ws.onopen = () => { 
    log('WebSocket connected. Notifying desktop...');
    ws.send(JSON.stringify({ type: 'peer-ready' })); 
  };
  ws.onclose = () => {
    log('Signaling closed.');
    if (started) setTimeout(connectWS, 2000);
  };
  ws.onerror = () => log('Signaling error');
  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'peer-ready') {
      await makeOffer();
    }
    else if (msg.type === 'answer') {
      await pc.setRemoteDescription(msg.sdp);
      log('Connected (LIVE)');
    }
    else if (msg.type === 'ice' && msg.candidate) { 
      try { await pc.addIceCandidate(msg.candidate); } catch (e) {} 
    }
    else if (msg.type === 'peer-left') {
      log('Desktop disconnected.');
    }
    else if (msg.type === 'mic-toggle') {
      // { type: 'mic-toggle', enabled: boolean } gửi từ nút mic trong PiP
      // "Companion Camera" (Alt+C) trên PC. Dùng track.enabled thay vì
      // stop()/replaceTrack để có thể bật lại tức thì, không cần renegotiate
      // SDP và không cần xin lại quyền mic.
      micWanted = !!msg.enabled;
      applyMicWanted();
      log(micWanted ? 'Mic: ON' : 'Mic: MUTED (từ Iris PC)');
    }
  };
}

$('start').onclick = async () => {
  if (started) {
    if (pc) pc.close();
    if (ws) ws.close();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    started = false;
    $('start').textContent = 'CONNECT TO IRIS';
    $('start').className = '';
    log('STANDBY');
    return;
  }
  try {
    // FEAT-COMP-MIC-01: mỗi lần bấm CONNECT thủ công là một phiên mới —
    // đồng bộ với reset phía PC (companionStream.setMicEnabled(true) khi
    // nhận offer mới), tránh trường hợp lần trước bị tắt mic rồi quên bật
    // lại khiến phiên kết nối mới im lặng ngay từ đầu.
    micWanted = true;
    $('mic-status').style.display = 'none';
    await getCam(); 
    connectWS(); 
    started = true; 
    $('start').textContent = 'DISCONNECT'; 
    $('start').className = 'alt';
  }
  catch (e) { log('Camera error: ' + e.message); }
};

$('flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  try { 
    await getCam(); 
    if (started) {
      await swapTracks();
    }
  }
  catch (e) { log('Flip error: ' + e.message); }
};
</script>
</body>
</html>
